# Développement local : docker compose up --build  ->  http://localhost:3000
# (la prod utilise docker-compose.prod.yml + image GHCR)
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: makemelearn
      POSTGRES_USER: makemelearn_user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-dev_only_password}
    volumes:
      - postgres_dev:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U makemelearn_user -d makemelearn"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://makemelearn_user:${POSTGRES_PASSWORD:-dev_only_password}@postgres:5432/makemelearn
      APP_URL: http://localhost:3000
      COOKIE_SECURE: "false"
    ports:
      - "3000:3000"

volumes:
  postgres_dev:
